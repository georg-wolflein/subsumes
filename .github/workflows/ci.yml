name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # clippy runs even when the formatting is off, so one failure does not hide the other.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --locked --all-targets -- --deny warnings

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --workspace --locked

  # The static checks of the Python package in python/. Each is seconds of work behind the
  # environment setup, and each runs whenever the setup succeeded, so one failure does not
  # hide the others. `uv sync` builds the native module, so it compiles the library.
  python-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        id: setup
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Check that the lockfile is current
        run: uv lock --check
      # The release pull request raises both. One that raised only the crate's would
      # publish the package under its old version.
      - name: Check that the package has the version of the crate
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq --raw-output '.packages[] | select(.name == "subsumes") | .version')
          package=$(uv version --short)
          echo "crate $crate, package $package"
          test "$crate" = "$package"
      - name: Install
        run: uv sync --all-groups
      - name: ruff check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run ruff check --output-format=github .
      - name: ruff format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run ruff format --check .
      - name: ty check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run ty check

  # The tests of the binding, on the oldest Python that the package supports and on the one
  # it is developed on.
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run pytest

  # The code of the action in action/: its static checks and its tests, with the library of
  # this checkout. `uv sync` builds the native module, so it compiles the library.
  action:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: action
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        id: setup
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Check that the lockfile is current
        run: uv lock --check
      # The action installs the library of the version that action.yml names. The release
      # pull request raises it with that of the crate; had it not, a release of the action
      # would run the library of the release before.
      - name: Check that the action names the version of the crate
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq --raw-output '.packages[] | select(.name == "subsumes") | .version')
          action=$(sed --quiet 's/^ *SUBSUMES_VERSION: \([^ ]*\) # x-release-please-version$/\1/p' ../action.yml)
          echo "crate $crate, action $action"
          test "$crate" = "$action"
      - name: Install
        run: uv sync --all-groups
      - name: ruff check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run ruff check --output-format=github .
      - name: ruff format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run ruff format --check .
      - name: ty check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run ty check
      - name: pytest
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pytest

  # The action as a workflow uses it, on each system that a runner has. It runs the library
  # of this checkout, which it builds, so the run says what the next release will do. The
  # schemas are those in action/tests/schemas/: one is narrowed in the working tree, and the
  # commit that is checked out is what it is compared with.
  action-run:
    name: action-run (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    env:
      SUBSUMES_ACTION_LIBRARY: ${{ github.workspace }}/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Narrow a schema
        shell: bash
        run: |
          echo '{"type": "integer", "minimum": 0}' > action/tests/schemas/changed.json
      - name: Require what the change breaks
        id: backward
        continue-on-error: true
        uses: ./
        with:
          files: action/tests/schemas/*.json
          base: HEAD
      - name: Check that the action failed and reported the change alone
        shell: bash
        env:
          OUTCOME: ${{ steps.backward.outcome }}
          REPORT: ${{ steps.backward.outputs.report }}
        run: |
          cat "$REPORT"
          test "$OUTCOME" = failure
          # The backticks are those of the report, and nothing for the shell to run.
          # shellcheck disable=SC2016
          grep --fixed-strings '| `action/tests/schemas/changed.json` | :x: **No** | Yes |' "$REPORT"
          # On Windows the checkout writes other line ends, which are no change to a schema.
          ! grep --fixed-strings 'unchanged.json' "$REPORT"
      - name: Require what the change keeps
        uses: ./
        with:
          files: action/tests/schemas/*.json
          base: HEAD
          compatibility: forward
      - name: Require nothing
        uses: ./
        with:
          files: action/tests/schemas/*.json
          base: HEAD
          compatibility: none

  # Runs on every pull request, so that regressions and improvements show, and posts the results
  # as a comment on the pull request.
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to download the results of the base branch
      pull-requests: write # to post the comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the pinned corpus
        run: make corpus
      - name: Run the library over the corpus
        run: make benchmark
      - name: Run the tests that read the corpus
        if: ${{ !cancelled() }}
        run: make test-corpus
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: benchmark-results
          path: target/results.jsonl
      - name: Fetch the results of the base branch
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Every push to main uploads its results; take the newest that the base branch has.
        run: |
          for sha in $(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$BASE_SHA&per_page=20" --jq '.[].sha'); do
            run_id=$(gh run list --workflow ci.yml --event push --commit "$sha" --status completed \
              --json databaseId --jq '.[0].databaseId')
            if [ -n "$run_id" ] && gh run download "$run_id" --name benchmark-results --dir baseline; then
              echo "baseline: $sha from run $run_id"
              echo "BASELINE_SHA=$sha" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::warning::no results found on the base branch; the comment will not compare"
      - name: Compare and render the comment
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # The label is read here, so adding it and running the job again is enough.
        run: |
          arguments=()
          if [ -f baseline/results.jsonl ]; then
            arguments+=(--base baseline/results.jsonl --base-label "${BASELINE_SHA::7}")
          fi
          if [ -n "$PR" ] && [ "$(gh pr view "$PR" --json labels \
              --jq 'any(.labels[]; .name == "allow-lost-verdicts")')" = true ]; then
            arguments+=(--allow-lost)
          fi
          cargo run --release --locked --quiet --package harness -- \
            compare target/results.jsonl "${arguments[@]}" --output comment.md
      - name: Add the comment to the job summary
        if: ${{ !cancelled() }}
        run: cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          header: benchmark
          path: comment.md
