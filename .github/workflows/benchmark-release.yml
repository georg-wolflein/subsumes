name: Benchmark release

# A release of https://github.com/georg-wolflein/subsumes-benchmark sends this repository the
# event `benchmark-released`, with its version, once the corpus archive is attached to the
# release. This workflow then pins the Makefile to that version and the SHA-256 of that
# archive, in a pull request on the branch build/benchmark: it opens the pull request, or
# replaces what the one that is open pins. A version that is not newer than the one on main
# changes nothing. Started by hand, it takes the version as an input.
#
# It acts as a GitHub App: a pull request opened with this workflow's own token would not
# start the checks, and the benchmark of CI among them.
on:
  repository_dispatch:
    types: [benchmark-released]
  workflow_dispatch:
    inputs:
      version:
        description: The version of the benchmark to pin, such as 0.9.0
        required: true
        type: string

permissions: {}

concurrency: benchmark-release

jobs:
  pin:
    if: vars.PR_BOT_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      BRANCH: build/benchmark
    steps:
      - name: Check the version
        run: |
          if ! printf '%s\n' "$VERSION" | grep --quiet --extended-regexp '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is no version"
            exit 1
          fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
      - name: Pin the Makefile to the release
        id: pin
        run: |
          current="$(sed -n 's/^BENCHMARK_VERSION := //p' Makefile)"
          newest="$(printf '%s\n%s\n' "$current" "$VERSION" | sort --version-sort | tail -n 1)"
          if [ "$current" = "$VERSION" ] || [ "$newest" != "$VERSION" ]; then
            echo "main pins the benchmark $current already, which is not older than $VERSION"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url="https://github.com/$GITHUB_REPOSITORY_OWNER/subsumes-benchmark/releases/download/v$VERSION/corpus.tar.zst"
          sha256="$(curl --fail --silent --show-error --location "$url" | sha256sum | cut -d ' ' -f 1)"
          sed -i \
            -e "s/^BENCHMARK_VERSION := .*/BENCHMARK_VERSION := $VERSION/" \
            -e "s/^BENCHMARK_SHA256 := .*/BENCHMARK_SHA256 := $sha256/" \
            Makefile
          git diff
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open the pull request, or update the one that is open
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          title="build: pin the benchmark to $VERSION"
          body="Pins the corpus to [subsumes-benchmark $VERSION](https://github.com/$GITHUB_REPOSITORY_OWNER/subsumes-benchmark/releases/tag/v$VERSION), which sent this repository an event when it was released. Opened by the [Benchmark release]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) workflow."
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          git switch --create "$BRANCH"
          git commit --all --message "$title"
          git push --force origin "$BRANCH"
          number="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --head "$BRANCH" --title "$title" --body "$body"
          fi
