[package]
name = "subsumes"
version = "0.3.0"
edition = "2024"
description = "JSON Schema inclusion: does one schema accept every instance that is valid under another?"
license = "MIT"
repository = "https://github.com/georg-wolflein/subsumes"
readme = "README.md"
keywords = ["json-schema", "jsonschema", "subsumption", "inclusion", "compatibility"]
categories = ["development-tools", "web-programming"]
# What a published crate holds: the library, and not the notes and tools of the repository.
include = ["/src", "/README.md", "/LICENSE"]

[dependencies]
fluent-uri = "0.4"
# Exact numbers: a bound or a `multipleOf` is a ratio of two integers of any size.
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
# The parser of the `regex` crate: a pattern means here what it means there.
regex-syntax = "0.8"
serde_json = "1"

[dev-dependencies]
# The DFAs are held against it: which strings a pattern of the `regex` crate matches.
regex = "1"
# And against this one: which strings a pattern of ECMA-262 matches.
regress = "0.12"
# The parser of ECMA-262 is held against it: which patterns are valid.
oxc_allocator = "0.159"
oxc_regular_expression = "0.159"
# And against this one: intersection, complement and inclusion.
regexsolver = { version = "1", default-features = false }
# Resolves references too, and the tests hold the library against it.
referencing = "0.61"

[workspace]
members = ["harness", "python"]
