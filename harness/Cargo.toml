[package]
name = "harness"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
# Only the validator: nothing is fetched, a schema carries what it references.
jsonschema = { version = "0.61", default-features = false }
percent-encoding = "2"
# The parser of the `regex` crate: the validator gets each pattern as that crate reads it.
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subsumes = { path = ".." }

[dev-dependencies]
# What the validator makes of a pattern is held against it.
regex = "1"
