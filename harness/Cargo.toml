[package]
name = "harness"
version = "0.4.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
# With `float_roundtrip` a number is read as the double nearest to it, however many digits it
# has. Without it serde_json may be off by one in the last place, and the counterexample to a
# schema with such a number is then no instance of it.
serde_json = { version = "1", features = ["float_roundtrip"] }
subsumes = { path = ".." }

[dev-dependencies]
# The validator that the runner of the benchmark asks about counterexamples, as a crate: the
# tests hold it to the reading of the library. Only the validator: nothing is fetched, a
# schema carries what it references.
jsonschema = { version = "0.61", default-features = false }
