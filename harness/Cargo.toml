[package]
name = "harness"
version = "0.4.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
# Only the validator: nothing is fetched, a schema carries what it references.
jsonschema = { version = "0.61", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subsumes = { path = ".." }
